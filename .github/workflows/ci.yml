name: Enterprise Knowledge Assistant CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'ingestion-pipeline'
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Backend Pytest & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ gcc curl libgomp1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio

      - name: Seed Enterprise Document Corpus
        env:
          PYTHONPATH: backend
        run: |
          python backend/app/utils/sample_data_generator.py

      - name: Run Pytest Suite
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ -v

      - name: Verify Docker Build
        run: |
          docker build -t enterprise-rag-backend:ci ./backend
