version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_rag_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - ENVIRONMENT=production
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./backend/evaluations.db:/app/evaluations.db
      - ./backend/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  default:
    name: enterprise_rag_network
